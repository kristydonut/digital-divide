<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIPHER</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <!-- Navbar -->
  <header>
    <div class="navbar">
      <div class="navbar_logo">
        <div class="navbar_logo-icon">C</div>
        <span>CIPHER</span>
      </div>
      <nav class="navbar_links">
        <a href="#">About</a>
        <a href="#">Issues</a>
        <a href="#">Resources</a>
        <a href="#">Solutions</a>
      </nav>
      <a href="#" class="navbar_cta">Contact Us</a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">

    <!-- Background Video -->
    <video class="hero_background" autoplay muted loop>
      <source src="style/landing.mp4" type="video/mp4">
    </video>

    <h1 class="hero_title">Bridging the gap in digital access, one story at a time</h1>
    <p class="hero_subtitle">
      We believe technology should be accessible to everyone, everywhere. 
      Our mission is to break down barriers and create digital opportunities 
      for communities worldwide.
    </p>
    <div class="hero_actions">
      <a href="#" class="btn btn--primary">Explore</a>  
      <a href="#" class="btn btn--outline">Learn</a>
    </div>
  </section>

</html>
